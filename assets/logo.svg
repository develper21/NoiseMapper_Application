<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle with Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur" />
      <feOffset dx="0" dy="5" result="offsetBlur" />
      <feFlood flood-color="#000" flood-opacity="0.3" />
      <feComposite in2="offsetBlur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)" />

  <!-- Animated Sound Waves / Noise Visualizer -->
  <g filter="url(#shadow)">
    <!-- Central Sound Bar -->
    <rect x="236" y="160" width="40" height="192" rx="20" fill="white" fill-opacity="0.9" />
    <!-- Left Bars -->
    <rect x="176" y="200" width="40" height="112" rx="20" fill="white" fill-opacity="0.7" />
    <rect x="116" y="230" width="40" height="52" rx="20" fill="white" fill-opacity="0.5" />
    <!-- Right Bars -->
    <rect x="296" y="190" width="40" height="132" rx="20" fill="white" fill-opacity="0.7" />
    <rect x="356" y="220" width="40" height="72" rx="20" fill="white" fill-opacity="0.5" />
  </g>

  <!-- Location Pin Overlay -->
  <path d="M256 380C256 380 340 300 340 220C340 173.61 302.39 136 256 136C209.61 136 172 173.61 172 220C172 300 256 380 256 380Z" 
        stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#shadow)" />
  
  <!-- Pin Inner Hole -->
  <circle cx="256" cy="220" r="28" fill="white" />
</svg>
